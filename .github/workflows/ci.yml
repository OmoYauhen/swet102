name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # tests + golden frames, fmt + clippy (host and thumbv6m), firmware build + size gates
      - run: nix flake check -L
      - name: firmware size
        run: |
          nix build .#firmware
          nix develop -c arm-none-eabi-size result/swet102.elf
